<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="b1" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07090f"/>
  <rect width="1200" height="630" fill="url(#b1)"/>
  <rect width="1200" height="630" fill="url(#b2)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5" rx="12"/>

  <!-- Logo icon -->
  <g transform="translate(56, 52)">
    <rect x="0" y="0" width="44" height="28" rx="6" fill="#6366f1" opacity="0.9"/>
    <rect x="58" y="0" width="44" height="28" rx="6" fill="#06b6d4" opacity="0.75"/>
    <rect x="29" y="70" width="44" height="28" rx="6" fill="#6366f1" opacity="0.9"/>
    <line x1="22" y1="28" x2="22" y2="50" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="50" x2="51" y2="70" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="28" x2="80" y2="50" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="50" x2="51" y2="70" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Brand name -->
  <text x="178" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="600" fill="rgba(238,242,247,0.55)" letter-spacing="0.3">AI Flowchart Studio</text>

  <!-- Free badge -->
  <rect x="178" y="90" width="96" height="24" rx="12" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>
  <text x="226" y="106" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.8">FREE · NO LOGIN</text>

  <!-- Main heading line 1 -->
  <text x="56" y="250" font-family="system-ui,-apple-system,sans-serif" font-size="68" font-weight="800" fill="#eef2f7" letter-spacing="-2">Generate flowcharts</text>

  <!-- Main heading line 2 — gradient -->
  <text x="56" y="335" font-family="system-ui,-apple-system,sans-serif" font-size="68" font-weight="800" fill="url(#tg)" letter-spacing="-2">from plain text</text>

  <!-- Subtitle -->
  <text x="56" y="400" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="400" fill="rgba(238,242,247,0.5)">Powered by Gemini AI · Mermaid, SVG &amp; PNG export · Runs in browser</text>

  <!-- Feature chips -->
  <rect x="56" y="442" width="156" height="36" rx="18" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
  <text x="134" y="464" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle">Text to Flowchart</text>

  <rect x="224" y="442" width="148" height="36" rx="18" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
  <text x="298" y="464" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle">Workflow Diagrams</text>

  <rect x="384" y="442" width="162" height="36" rx="18" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
  <text x="465" y="464" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle">System Architecture</text>

  <!-- URL -->
  <text x="56" y="572" font-family="system-ui,sans-serif" font-size="18" fill="rgba(238,242,247,0.22)" font-weight="400">ai-flowchart-studio.vercel.app</text>

  <!-- Right side: flowchart illustration -->
  <g transform="translate(710, 80)" opacity="0.85">
    <!-- Glass card background -->
    <rect x="0" y="0" width="430" height="490" rx="16" fill="rgba(12,16,28,0.7)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Start node -->
    <rect x="140" y="30" width="150" height="44" rx="22" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.55)" stroke-width="1.5"/>
    <text x="215" y="57" text-anchor="middle" fill="#a5b4fc" font-size="14" font-family="system-ui,sans-serif" font-weight="600">Start</text>

    <!-- Connector -->
    <line x1="215" y1="74" x2="215" y2="110" stroke="rgba(99,102,241,0.4)" stroke-width="2"/>
    <polygon points="210,108 215,118 220,108" fill="rgba(99,102,241,0.6)"/>

    <!-- Process node -->
    <rect x="90" y="118" width="250" height="44" rx="8" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.45)" stroke-width="1.5"/>
    <text x="215" y="144" text-anchor="middle" fill="#c4b5fd" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Validate credentials</text>

    <!-- Connector -->
    <line x1="215" y1="162" x2="215" y2="198" stroke="rgba(99,102,241,0.4)" stroke-width="2"/>
    <polygon points="210,196 215,206 220,196" fill="rgba(99,102,241,0.6)"/>

    <!-- Decision diamond -->
    <polygon points="215,206 318,256 215,306 112,256" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.45)" stroke-width="1.5"/>
    <text x="215" y="260" text-anchor="middle" fill="#a5b4fc" font-size="12" font-family="system-ui,sans-serif" font-weight="600">Account exists?</text>

    <!-- Yes arrow right -->
    <line x1="318" y1="256" x2="370" y2="256" stroke="rgba(6,182,212,0.6)" stroke-width="2"/>
    <polygon points="368,252 378,256 368,260" fill="rgba(6,182,212,0.8)"/>
    <rect x="378" y="234" width="36" height="44" rx="8" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
    <text x="396" y="258" text-anchor="middle" fill="#67e8f9" font-size="10" font-family="system-ui,sans-serif" font-weight="600">✓</text>
    <text x="340" y="248" font-size="11" fill="rgba(6,182,212,0.8)" font-family="system-ui,sans-serif">Yes</text>

    <!-- No arrow left -->
    <line x1="112" y1="256" x2="60" y2="256" stroke="rgba(239,68,68,0.5)" stroke-width="2" stroke-dasharray="5,4"/>
    <polygon points="62,252 52,256 62,260" fill="rgba(239,68,68,0.6)"/>
    <rect x="16" y="234" width="36" height="44" rx="8" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.3)" stroke-width="1.5"/>
    <text x="34" y="258" text-anchor="middle" fill="rgba(252,165,165,0.8)" font-size="10" font-family="system-ui,sans-serif" font-weight="600">✗</text>
    <text x="60" y="248" font-size="11" fill="rgba(239,68,68,0.7)" font-family="system-ui,sans-serif">No</text>

    <!-- Down from diamond -->
    <line x1="215" y1="306" x2="215" y2="342" stroke="rgba(6,182,212,0.5)" stroke-width="2"/>
    <polygon points="210,340 215,350 220,340" fill="rgba(6,182,212,0.7)"/>

    <!-- OTP node -->
    <rect x="90" y="350" width="250" height="44" rx="8" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
    <text x="215" y="376" text-anchor="middle" fill="#67e8f9" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Verify OTP code</text>

    <!-- Down -->
    <line x1="215" y1="394" x2="215" y2="430" stroke="rgba(6,182,212,0.5)" stroke-width="2"/>
    <polygon points="210,428 215,438 220,428" fill="rgba(6,182,212,0.7)"/>

    <!-- End node -->
    <rect x="140" y="438" width="150" height="44" rx="22" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.45)" stroke-width="1.5"/>
    <text x="215" y="464" text-anchor="middle" fill="#67e8f9" font-size="14" font-family="system-ui,sans-serif" font-weight="600">Dashboard</text>

    <!-- Yes/No labels -->
    <text x="360" y="246" font-size="10" fill="rgba(6,182,212,0.7)" font-family="system-ui,sans-serif" font-weight="600">Yes</text>
    <text x="54" y="246" font-size="10" fill="rgba(239,68,68,0.7)" font-family="system-ui,sans-serif" font-weight="600">No</text>

    <!-- Mermaid label -->
    <rect x="6" y="456" width="120" height="22" rx="4" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
    <text x="66" y="471" text-anchor="middle" fill="rgba(165,180,252,0.6)" font-size="10" font-family="'JetBrains Mono',monospace" font-weight="400">flowchart TD</text>
  </g>
</svg>
